<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    font-family:Arial,sans-serif;
}

video{

    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;

    z-index:-2;
    color: black;
    transition:opacity .8s ease;

}

video.fade{
    color: black;
    opacity:0;

}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.25);
}

.loadingBox{

    position:absolute;

    left:50%;
    bottom:90px;

    transform:translateX(-50%);

    width:420px;
    max-width:80%;

}

.bar{

    width:100%;
    height:14px;

    background:rgba(255,255,255,.18);

    border-radius:999px;

    overflow:hidden;

}

.fill{

    width:0%;

    height:100%;

    background:linear-gradient(
        90deg,
        #8fd8ff,
        #c9f2ff,
        #8fd8ff
    );

    border-radius:999px;

}

.percent{

    margin-top:12px;

    color:white;

    text-align:center;

    font-size:20px;

    text-shadow:0 0 10px rgba(255,255,255,.6);

}

#continue{
    margin-top:30px;
    text-align:center;
    color:white;
    font-size:18px;

    visibility:hidden;
    opacity:0;

}

#continue.show{

    visibility:visible;
    opacity:1;

    animation:ease-out 1.3s infinite;

}

@keyframes blink{

    50%{

        opacity:.35;

    }

}

#fade{

    position:fixed;
    inset:0;

    background:black;

    opacity:0;
    pointer-events:none;

    transition:opacity .8s ease;

    z-index:9999;

}

#fade.show{

    opacity:1;

}

</style>

</head>

<body>

<video id="loadingVideo" autoplay muted playsinline>

    <source src="load.mp4" type="video/mp4">

</video>

<div class="overlay"></div>

<div class="loadingBox">

<div class="bar">

<div class="fill" id="fill"></div>

</div>

<div class="percent" id="percent">

0%

</div>

<div id="continue">

Click anywhere to continue...

</div>

</div>

<div id="fade"></div>

<script>

const video = document.getElementById("loadingVideo");
video.onended = function(){

    video.classList.add("fade");

    setTimeout(()=>{

        video.src = "load loop.mp4";
        video.loop = true;
        video.play();

        video.classList.remove("fade");

    },800);

}


const fill = document.getElementById("fill");
const percent = document.getElementById("percent");
const cont = document.getElementById("continue");

let progress = 0;

const loading = setInterval(()=>{

    progress += Math.random()*2;

    if(progress > 100) progress = 100;

    fill.style.width = progress+"%";
    percent.innerHTML = Math.floor(progress)+"%";

   if(progress >= 100){

    clearInterval(loading);

    cont.style.visibility = "visible";

    setTimeout(()=>{
        cont.style.opacity = "1";
    },100);

    document.addEventListener("click",goNext);
    }
    
},75);

function goNext(){

    const fade = document.getElementById("fade");

    fade.classList.add("show");

    setTimeout(()=>{

        window.location.href="Happyy birthdayyy.html";

    },900);

}

</script>

</body>
</html>
