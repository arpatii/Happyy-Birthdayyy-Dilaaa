Di bumi yang luas ini, 
bertemu denganmu adalah hal paling kusyukuri sepanjang hidup. 
Kau mengajarkanku bahwa mengasihi tak selamanya harus saling memiliki. 
Terkadang cukup hati saja yang tau sejauh mana aku mencintaimu, 
perihal berakhir denganmu atau tidak, 
biar semesta yang mengatur bagaimana baiknya.

Di perjalananmu yang jauh itu, 
luaskan pandangmu, tabahkan hatimu. 
Aku tau kau mampu menghadapi dunia dan segala badainya. 
Bagaimana tenang jiwamu membuatku lebih tangguh menghadapi kicauan hidup yang tiada henti-hentinya. 
Maka biar rentang doaku yang memelukmu, 
menjagamu di setiap jalan yang kau tempuh. 
Dan semoga kelak kau menyadari, 
bahwa perasaanku tak pernah surut, 
meskipun akhirnya kau tak pulang ke arahku.

